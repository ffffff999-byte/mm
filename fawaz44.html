
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة تحليل التقويم الخارجي للمدارس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#f0f4f8;direction:rtl;color:#1e293b}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;flex-shrink:0;background:linear-gradient(180deg,#0c2d57 0%,#0f3a6e 60%,#0c2d57 100%);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;box-shadow:2px 0 20px rgba(0,0,0,.25);transition:width .3s;z-index:50}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-badge,.sidebar.collapsed .logo-text,.sidebar.collapsed .school-box,.sidebar.collapsed .sidebar-footer{display:none}
.sidebar.collapsed .nav-btn{justify-content:center;padding:10px}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo-wrap{display:flex;align-items:center;gap:8px;overflow:hidden}
.logo-icon{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-text{overflow:hidden;white-space:nowrap}
.logo-text p{color:#fff;font-weight:800;font-size:12px;font-family:'Tajawal'}
.logo-text span{color:rgba(255,255,255,.55);font-size:10px}
.toggle-btn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s}
.toggle-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.school-box{margin:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.school-box .sname{color:#fff;font-weight:700;font-size:11px;font-family:'Tajawal';line-height:1.5}
.school-box .sbadges{display:flex;align-items:center;gap:6px;margin-top:5px}
.school-box .slevel{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(56,189,248,.2);color:#7dd3fc}
.school-box .spct{font-weight:800;color:#34d399;font-size:15px;font-family:'Tajawal'}
.nav-wrap{flex:1;overflow-y:auto;padding:8px 6px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;margin-bottom:2px;border:none;background:transparent;color:rgba(255,255,255,.65);cursor:pointer;text-align:right;font-family:'Cairo';font-size:12.5px;font-weight:500;transition:all .2s}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-btn.active{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border-right:3px solid #38bdf8;color:#fff}
.nav-icon{font-size:16px;flex-shrink:0}
.nav-label{flex:1;white-space:nowrap;overflow:hidden}
.nav-badge{font-size:10px;padding:1px 6px;border-radius:20px;color:#fff;font-weight:700;min-width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:10px;border-top:1px solid rgba(255,255,255,.1);text-align:center}
.sidebar-footer p{color:rgba(255,255,255,.35);font-size:10px}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.breadcrumb{display:flex;align-items:center;gap:8px;font-family:'Cairo';font-size:13px;color:#6b7280}
.breadcrumb .cur{font-weight:700;color:#1e293b}
.topbar-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo';font-size:12px;font-weight:600;transition:all .2s}
.tbtn-primary{background:#0c2d57;color:#fff}.tbtn-primary:hover{background:#0f3a6e}
.tbtn-secondary{background:#f1f5f9;color:#475569}.tbtn-secondary:hover{background:#e2e8f0}
.tbtn-danger{background:#fff;color:#ef4444;border:1.5px solid #fca5a5}.tbtn-danger:hover{background:#fef2f2;border-color:#ef4444}
.tbtn-success{background:#10b981;color:#fff}.tbtn-success:hover{background:#059669}
.content{padding:20px;flex:1}
.page{display:none}
.page.active{display:block;animation:fadeUp .3s cubic-bezier(.23,1,.32,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.04);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1),0 8px 28px rgba(0,0,0,.07);transform:translateY(-1px)}
.hero{border-radius:14px;overflow:hidden;margin-bottom:20px}
.hero-body{padding:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.hero-title h1{color:#fff;font-size:20px;font-weight:800;font-family:'Tajawal';margin-bottom:3px}
.hero-title p{color:rgba(255,255,255,.65);font-size:11px;font-family:'Cairo'}
.hero-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:flex;align-items:center;gap:3px;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.12);font-size:10.5px;font-family:'Cairo'}
.chip .cl{color:rgba(255,255,255,.6)}.chip .cv{color:#fff;font-weight:600}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,.15)}
.hstat{padding:10px;text-align:center;border-right:1px solid rgba(255,255,255,.1)}
.hstat:last-child{border-right:none}
.hstat .hval{color:#fff;font-size:20px;font-weight:800;font-family:'Tajawal'}
.hstat .hlbl{color:rgba(255,255,255,.55);font-size:10px;font-family:'Cairo'}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:600px){.g3,.g4,.g2{grid-template-columns:1fr}.sidebar{width:64px}.sidebar .nav-label,.sidebar .nav-badge,.sidebar .logo-text,.sidebar .school-box,.sidebar .sidebar-footer{display:none}.sidebar .nav-btn{justify-content:center;padding:10px}}
.cls-card{padding:18px;border-radius:12px;border-right:4px solid}
.cls-strength{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#059669}
.cls-weakness{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#d97706}
.cls-critical{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#dc2626}
.cls-count{font-size:36px;font-weight:900;font-family:'Tajawal'}
.cls-desc{font-size:11px;color:#6b7280;font-family:'Cairo';margin:6px 0}
.pbar-wrap{display:flex;align-items:center;gap:8px}
.pbar-bg{flex:1;height:7px;border-radius:4px;background:#e5e7eb;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.23,1,.32,1)}
.pf-s{background:linear-gradient(90deg,#059669,#34d399)}
.pf-w{background:linear-gradient(90deg,#d97706,#fbbf24)}
.pf-c{background:linear-gradient(90deg,#dc2626,#f87171)}
.pf-b{background:linear-gradient(90deg,#1a4a8a,#3b82f6)}
.pbar-pct{font-size:12px;font-weight:700;min-width:44px;text-align:left;font-family:'Tajawal'}
.lvl{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;font-family:'Cairo';white-space:nowrap}
.lvl-ex{background:#d1fae5;color:#065f46}.lvl-pr{background:#dbeafe;color:#1e40af}
.lvl-la{background:#fef3c7;color:#92400e}.lvl-pr2{background:#fee2e2;color:#991b1b}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;font-family:'Cairo';white-space:nowrap}
.badge-s{background:#d1fae5;color:#065f46}.badge-w{background:#fef3c7;color:#92400e}.badge-c{background:#fee2e2;color:#991b1b}
.circ{position:relative;display:inline-flex;align-items:center;justify-content:center}
.circ svg{transform:rotate(-90deg)}
.circ-lbl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;inset:0}
.ind-card{border-radius:10px;border-right:3px solid;margin-bottom:10px;overflow:hidden;transition:box-shadow .2s;background:#fff}
.ind-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.1)}
.ind-header{padding:12px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.ind-num{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.ind-info{flex:1;min-width:0}
.ind-desc{font-size:12px;color:#374151;line-height:1.65;font-family:'Cairo'}
.ind-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.ind-tag{font-size:10px;padding:2px 8px;border-radius:20px;font-family:'Cairo'}
.ind-pct{text-align:left;flex-shrink:0}
.ind-pct .pnum{font-size:18px;font-weight:900;font-family:'Tajawal'}
.ind-pct .plbl{font-size:9px;color:#9ca3af;font-family:'Cairo'}
.ind-body{padding:0 14px 14px;border-top:1px solid rgba(0,0,0,.06)}
.plan-box{border-radius:9px;padding:12px;margin-bottom:10px}
.plan-title{font-size:12.5px;font-weight:700;margin-bottom:7px;font-family:'Tajawal';display:flex;align-items:center;gap:5px}
.plan-acts{list-style:none}
.plan-acts li{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;font-size:11.5px;color:#374151;font-family:'Cairo';line-height:1.65}
.plan-acts li .an{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;margin-top:2px}
.recs-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.rec-tag{display:flex;align-items:center;gap:3px;padding:3px 9px;border-radius:7px;font-size:10.5px;font-family:'Cairo';font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center}
.fbtn{padding:5px 11px;border-radius:7px;border:none;background:#f1f5f9;color:#475569;cursor:pointer;font-family:'Cairo';font-size:11px;font-weight:500;transition:all .15s}
.fbtn:hover{background:#e2e8f0}.fbtn.active{color:#fff}
.search-box{position:relative;margin-bottom:14px}
.search-box input{width:100%;padding:9px 34px 9px 12px;border:1px solid #e5e7eb;border-radius:9px;font-family:'Cairo';font-size:13px;outline:none;transition:border-color .2s;background:#fff}
.search-box input:focus{border-color:#1a4a8a;box-shadow:0 0 0 3px rgba(26,74,138,.1)}
.search-ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:15px}
.tbl-wrap{overflow-x:auto;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:#0c2d57}
thead th{padding:10px 12px;text-align:right;font-size:11px;font-weight:700;color:#fff;font-family:'Cairo';white-space:nowrap}
tbody tr{border-bottom:1px solid #f0f0f0;transition:background .15s}
tbody tr:hover{background:rgba(12,45,87,.03)}
tbody tr:nth-child(even){background:#fafafa}
tbody td{padding:9px 12px;font-size:11.5px;font-family:'Cairo';color:#374151}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:18px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h3{font-size:16px;font-weight:700;font-family:'Tajawal';color:#1e293b}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:#f1f5f9;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.modal-close:hover{background:#e2e8f0}
.modal-body{padding:20px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:#374151;font-family:'Cairo';margin-bottom:5px}
.form-input{width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-family:'Cairo';font-size:13px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:#1a4a8a;box-shadow:0 0 0 3px rgba(26,74,138,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{padding:14px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}
.import-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.import-modal{background:#fff;border-radius:16px;width:100%;max-width:540px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.import-header{padding:18px 20px;background:linear-gradient(135deg,#0c2d57,#1a4a8a);display:flex;align-items:center;justify-content:space-between}
.import-header h3{color:#fff;font-size:15px;font-weight:700;font-family:'Tajawal'}
.import-body{padding:24px}
.drop-zone{border:2px dashed #cbd5e1;border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:#f8fafc}
.drop-zone:hover,.drop-zone.drag-over{border-color:#1a4a8a;background:#eff6ff}
.drop-zone .dz-icon{font-size:40px;margin-bottom:10px}
.drop-zone .dz-title{font-size:14px;font-weight:700;color:#1e293b;font-family:'Tajawal';margin-bottom:4px}
.drop-zone .dz-sub{font-size:11px;color:#6b7280;font-family:'Cairo'}
.drop-zone input{display:none}
.import-progress{margin-top:16px}
.import-log{background:#f8fafc;border-radius:8px;padding:12px;font-size:11px;font-family:'Cairo';color:#374151;line-height:1.8;max-height:160px;overflow-y:auto;border:1px solid #e5e7eb}
.import-log .log-ok{color:#059669}.import-log .log-warn{color:#d97706}.import-log .log-err{color:#dc2626}
.import-footer{padding:14px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-family:'Cairo';font-size:13px;z-index:2000;transition:transform .3s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}
.chart-card{padding:18px}
.chart-title{font-size:13.5px;font-weight:700;color:#1e293b;font-family:'Tajawal';margin-bottom:14px;display:flex;align-items:center;gap:5px}
.chart-wrap{position:relative;height:260px}
.top-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.top-n{font-size:11px;font-weight:700;color:#9ca3af;width:16px;text-align:center;flex-shrink:0}
.top-info{flex:1;min-width:0}
.top-info p{font-size:11px;color:#374151;font-family:'Cairo';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.plan-group{border-radius:12px;overflow:hidden;border:1px solid;margin-bottom:14px;transition:box-shadow .2s}
.plan-group:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.pg-header{padding:14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.pg-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pg-meta{flex:1}
.pg-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pg-body{padding:14px;border-top:1px solid;background:#fff;display:none}
.pg-toggle{color:#9ca3af;font-size:11px;flex-shrink:0;margin-top:3px}
.domain-card{border-radius:12px;overflow:hidden;margin-bottom:16px;border:1px solid #e5e7eb;background:#fff}
.domain-header{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#0c2d57,#1a4a8a)}
.domain-icon{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.domain-info{flex:1}
.domain-info h3{color:#fff;font-size:14px;font-weight:700;font-family:'Tajawal'}
.domain-info p{color:rgba(255,255,255,.65);font-size:10px;font-family:'Cairo'}
.domain-pct{color:#34d399;font-size:20px;font-weight:900;font-family:'Tajawal'}
.domain-body{padding:14px;display:none}
.criterion-card{border-radius:9px;border:1px solid #e5e7eb;margin-bottom:10px;overflow:hidden}
.criterion-header{padding:10px 12px;background:#f8fafc;cursor:pointer;display:flex;align-items:center;gap:8px}
.criterion-header h4{flex:1;font-size:12.5px;font-weight:700;color:#1e293b;font-family:'Tajawal'}
.criterion-body{padding:10px 12px;display:none}
.empty-state{text-align:center;padding:48px 20px;color:#9ca3af}
.empty-state .ei{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:16px;font-weight:700;color:#374151;font-family:'Tajawal';margin-bottom:6px}
.empty-state p{font-size:12px;font-family:'Cairo'}
@media print{.sidebar,.topbar,.topbar-btns{display:none!important}.main{margin:0!important}.content{padding:10px!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-wrap">
      <div class="logo-icon">🏫</div>
      <div class="logo-text">
        <p>منصة التقويم المدرسي</p>
        <span id="sidebarYear">1446هـ / 2025م</span>
      </div>
    </div>
    <button class="toggle-btn" onclick="toggleSidebar()" title="طي القائمة">⇄</button>
  </div>
  <div class="school-box">
    <p class="sname" id="sidebarSchoolName">اكتب اسم المدرسة</p>
    <div class="sbadges">
      <span class="slevel" id="sidebarLevel">التقدم</span>
      <span class="spct" id="sidebarPct">79.0%</span>
    </div>
  </div>
  <nav class="nav-wrap">
    <button class="nav-btn active" onclick="showPage('dashboard',this)"><span class="nav-icon">📊</span><span class="nav-label">لوحة المعلومات</span></button>
    <button class="nav-btn" onclick="showPage('domains',this)"><span class="nav-icon">🗂️</span><span class="nav-label">المجالات والمعايير</span></button>
    <button class="nav-btn" onclick="showPage('strengths',this)"><span class="nav-icon">✅</span><span class="nav-label">نقاط القوة</span><span class="nav-badge" id="nbStrength" style="background:#10b981">0</span></button>
    <button class="nav-btn" onclick="showPage('weaknesses',this)"><span class="nav-icon">⚠️</span><span class="nav-label">نقاط الضعف</span><span class="nav-badge" id="nbWeakness" style="background:#f59e0b">0</span></button>
    <button class="nav-btn" onclick="showPage('critical',this)"><span class="nav-icon">🚨</span><span class="nav-label">النقاط الحرجة</span><span class="nav-badge" id="nbCritical" style="background:#ef4444">0</span></button>
    <button class="nav-btn" onclick="showPage('improvement',this)"><span class="nav-icon">📈</span><span class="nav-label">خطط التحسين</span></button>
    <button class="nav-btn" onclick="showPage('stakeholders',this)"><span class="nav-icon">👥</span><span class="nav-label">آراء أصحاب المصلحة</span></button>
    <button class="nav-btn" onclick="showPage('all',this)"><span class="nav-icon">📋</span><span class="nav-label">جميع المؤشرات</span><span class="nav-badge" id="nbAll" style="background:#3b82f6">0</span></button>
  </nav>
  <div class="sidebar-footer">
    <p>هيئة تقويم التعليم والتدريب</p>
