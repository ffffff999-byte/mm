<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شهادات شكر قابلة للتعديل - الانضباط</title>
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
:root{--green:#123f3a;--green2:#176158;--gold:#c9a54c;--paper:#fffdf8;--cream:#f7f0df;--ink:#252525}
html,body{margin:0;padding:0;background:#eee7d7;font-family:"Tahoma","Arial",sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.editor{position:sticky;top:0;z-index:99;background:linear-gradient(135deg,#123f3a,#176158);color:#fff;padding:12px 18px;box-shadow:0 6px 20px #0003}
.editor h1{margin:0 0 8px;font-size:20px}.editor p{margin:0 0 10px;color:#f6ecd0;font-size:13px}.tools{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;align-items:end}.tools label{font-size:12px;color:#f6ecd0;display:block;margin-bottom:4px}.tools input,.tools textarea,.tools select{width:100%;border:1px solid #d6c080;border-radius:10px;padding:9px;background:#fff;color:#222;font-family:inherit}.tools textarea{height:42px;resize:vertical}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:bold;font-family:inherit}.btn.gold{background:var(--gold);color:#123f3a}.btn.light{background:#fff;color:#123f3a}.btn.danger{background:#823737;color:#fff}.hint{font-size:12px;color:#fff;margin-top:8px}.wrap{padding:18px 0 34px}.page{width:297mm;height:210mm;margin:0 auto 16px;page-break-after:always;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f9f5ec 0%,#fffaf0 50%,#f7f0df 100%);overflow:hidden}.certificate{position:relative;width:276mm;height:188mm;background:radial-gradient(circle at 50% 10%,rgba(218,184,104,.18),transparent 32%),var(--paper);border:3.2mm solid var(--green);outline:1.5mm solid var(--gold);box-shadow:0 7mm 18mm rgba(0,0,0,.12);padding:9mm 18mm;text-align:center;overflow:hidden}.certificate:before{content:"";position:absolute;inset:7mm;border:1.1mm solid var(--gold);border-radius:3mm;pointer-events:none}.certificate:after{content:"";position:absolute;inset:13mm;border:.35mm dashed rgba(19,63,58,.35);border-radius:4mm;pointer-events:none}.corner{position:absolute;width:35mm;height:35mm;border:0 solid var(--gold);opacity:.78}.c1{top:11mm;right:11mm;border-top:2mm solid var(--gold);border-right:2mm solid var(--gold);border-radius:0 6mm 0 0}.c2{top:11mm;left:11mm;border-top:2mm solid var(--gold);border-left:2mm solid var(--gold);border-radius:6mm 0 0 0}.c3{bottom:11mm;right:11mm;border-bottom:2mm solid var(--gold);border-right:2mm solid var(--gold);border-radius:0 0 6mm 0}.c4{bottom:11mm;left:11mm;border-bottom:2mm solid var(--gold);border-left:2mm solid var(--gold);border-radius:0 0 0 6mm}.topline,.ribbon,.subtitle,.role,.name,.ornament,.body,.month-badge,.footer{position:relative;z-index:2}.topline{color:var(--green);font-size:15pt;font-weight:800;letter-spacing:.2pt;margin-top:1mm}.ribbon{display:inline-block;margin:5mm auto 2mm;padding:3mm 20mm;color:#fff;background:linear-gradient(90deg,#0f3b36,#176158,#0f3b36);border-radius:40mm;font-size:30pt;font-weight:900;box-shadow:0 1.5mm 0 var(--gold),0 3mm 8mm rgba(0,0,0,.12)}.subtitle{color:#69562b;font-size:21pt;margin-top:3mm}.role{color:var(--green);font-size:18pt;margin-top:2mm;font-weight:700}.name{margin:2mm auto 1mm;padding:2mm 16mm 3mm;min-width:112mm;display:inline-block;color:#9b7020;font-size:34pt;line-height:1.35;border-bottom:1.1mm solid var(--gold);font-weight:900}.ornament{color:var(--gold);font-size:22pt;margin:1mm 0}.body{width:210mm;margin:1mm auto 2.5mm;color:#2a2a2a;font-size:17.5pt;line-height:1.55}.month-badge{position:absolute;top:17mm;right:22mm;display:inline-block;font-size:12.5pt;color:var(--green);background:#f6ecd0;border:.45mm solid var(--gold);border-radius:30mm;padding:1.8mm 7mm;white-space:nowrap;font-weight:800}.footer{position:absolute;left:20mm;right:20mm;bottom:15mm;display:flex;justify-content:space-between;gap:12mm;direction:rtl}.field{width:33%;text-align:center;color:var(--green);font-size:15pt}.field span{display:block;font-weight:900;margin-bottom:3mm}.field b{color:#555;font-size:14pt;font-weight:400}.editable[contenteditable="true"]{outline:1px dashed transparent}.editable[contenteditable="true"]:hover,.editable[contenteditable="true"]:focus{outline:1.5px dashed #c9a54c;background:#fff8dc55;border-radius:6px}.no-print-badge{position:absolute;top:8mm;left:10mm;z-index:8;background:#123f3a;color:#fff;border-radius:12px;padding:5px 10px;font-size:12px;opacity:.8}.selected{box-shadow:0 0 0 6px #c9a54c55}
@media(max-width:900px){.tools{grid-template-columns:1fr 1fr}.page{transform:scale(.45);transform-origin:top center;margin-bottom:-108mm}.wrap{overflow:hidden}.editor{position:relative}.btns{grid-column:1/-1}}
@media print{body{background:#fff}.editor,.no-print-badge{display:none!important}.wrap{padding:0}.page{margin:0;box-shadow:none}.certificate{box-shadow:none}.page:not(.printme){display:none!important}.page.print-all{display:flex!important}}
</style>
</head>
<body>
<div class="editor">
  <h1>شهادات شكر وتقدير قابلة للتعديل</h1>
  <p>اضغط على أي نص داخل الشهادة وعدّله مباشرة، أو استخدم الحقول التالية لتطبيق تعديل جماعي.</p>
  <div class="tools">
    <div><label>العنوان العلوي</label><input id="topline" value="المملكة العربية السعودية · وزارة التعليم"></div>
    <div><label>المسمى</label><input id="role" value="المعلمة الفاضلة"></div>
    <div><label>التوقيع الأول</label><input id="sign1" value="رائدة النشاط"></div>
    <div><label>التوقيع الثاني</label><input id="sign2" value="قائدة المدرسة"></div>
    <div><label>التاريخ</label><input id="date" value=" /   /   1447هـ"></div>
    <div><label>صيغة الشكر الجماعية</label><textarea id="thanks">تقديرًا لانضباطها المتميز، والتزامها بالحضور، وحرصها على أداء رسالتها التعليمية بروح مسؤولة خلال شهر {{month}}؛ سائلين الله لها دوام التوفيق والسداد.</textarea></div>
    <div class="btns" style="grid-column:1/-1">
      <button class="btn gold" onclick="applyAll()">تطبيق التعديلات على كل الشهادات</button>
      <button class="btn light" onclick="printAll()">طباعة جميع الشهادات</button>
      <button class="btn light" onclick="printSelected()">طباعة الشهادة المحددة فقط</button>
      <button class="btn danger" onclick="clearSelection()">إلغاء التحديد</button>
    </div>
  </div>
  <div class="hint">معلومة مهمة: PDF غالبًا يكون ثابتًا. التعديل الصحيح هنا من ملف HTML ثم اختر طباعة أو حفظ كـ PDF من المتصفح.</div>
</div>
<div id="certificates" class="wrap"></div>
<script>
const data = [
  {name:'فاطمة سيف',month:'شوال'},
  {name:'نسرين الشيخ',month:'شوال'},
  {name:'عزيزة الجهني',month:'شوال'},
  {name:'وسام المباركي',month:'شوال'},
  {name:'أنوار الحربي',month:'شوال'},
  {name:'نجوى الحربي',month:'شوال'},
  {name:'إيمان الجهني',month:'شوال'},
  {name:'سامية البلادي',month:'شوال'},
  {name:'ميعاد الجهني',month:'شوال'},
  {name:'مسرة المزيني',month:'شوال'},
  {name:'جواهر الحافظي',month:'شوال'},
  {name:'منال الردادي',month:'شوال'},
  {name:'بدرية عبيد',month:'ذي القعدة'},
  {name:'سامية الأحمدي',month:'ذي القعدة'},
  {name:'منى الهدباني',month:'ذي القعدة'},
  {name:'رخية الحويضاني',month:'ذي القعدة'},
  {name:'تهاني الجهني',month:'ذي القعدة'},
  {name:'نوار الجهني',month:'ذي القعدة'}
];
function t(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function certificate(item,i){
  const thanks = document.getElementById('thanks').value.replace('{{month}}', item.month);
  return `<section class="page print-all" onclick="selectPage(this)">
    <div class="certificate">
      <div class="no-print-badge">شهادة ${i+1}</div>
      <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
      <div class="topline editable" contenteditable="true">${t(document.getElementById('topline').value)}</div>
      <div class="ribbon editable" contenteditable="true">شهادة شكر وتقدير</div>
      <div class="subtitle editable" contenteditable="true">تُقدِّم إدارة المدرسة خالص الشكر والتقدير إلى</div>
      <div class="role editable" contenteditable="true">${t(document.getElementById('role').value)}</div>
      <div class="name editable" contenteditable="true">${t(item.name)}</div>
      <div class="ornament editable" contenteditable="true">✦ ✧ ✦</div>
      <p class="body editable" contenteditable="true">${t(thanks)}</p>
      <div class="month-badge editable" contenteditable="true">منضبطة في شهر ${t(item.month)}</div>
      <div class="footer">
        <div class="field"><span class="editable" contenteditable="true">${t(document.getElementById('sign1').value)}</span><b class="editable" contenteditable="true">........................</b></div>
        <div class="field"><span class="editable" contenteditable="true">${t(document.getElementById('sign2').value)}</span><b class="editable" contenteditable="true">........................</b></div>
        <div class="field"><span class="editable" contenteditable="true">التاريخ</span><b class="editable" contenteditable="true">${t(document.getElementById('date').value)}</b></div>
      </div>
    </div>
  </section>`;
}
function render(){document.getElementById('certificates').innerHTML=data.map(certificate).join('')}
function applyAll(){
  document.querySelectorAll('.page').forEach((p,i)=>{
    const m=data[i].month;
    p.querySelector('.topline').textContent=document.getElementById('topline').value;
    p.querySelector('.role').textContent=document.getElementById('role').value;
    p.querySelector('.body').textContent=document.getElementById('thanks').value.replace('{{month}}',m);
    p.querySelector('.field:nth-child(1) span').textContent=document.getElementById('sign1').value;
    p.querySelector('.field:nth-child(2) span').textContent=document.getElementById('sign2').value;
    p.querySelector('.field:nth-child(3) b').textContent=document.getElementById('date').value;
  });
}
function selectPage(el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('selected','printme'));el.classList.add('selected','printme')}
function clearSelection(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('selected','printme'));}
function printAll(){document.querySelectorAll('.page').forEach(p=>{p.classList.add('print-all');p.classList.remove('printme')});window.print()}
function printSelected(){let s=document.querySelector('.page.selected');if(!s){alert('اختر الشهادة أولًا بالضغط عليها.');return;}document.querySelectorAll('.page').forEach(p=>p.classList.remove('print-all','printme'));s.classList.add('printme');window.print();setTimeout(()=>document.querySelectorAll('.page').forEach(p=>p.classList.add('print-all')),500)}
render();
</script>
</body>
</html>
