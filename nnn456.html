let state=hydrate(load());
function deepMerge(base,saved){
  if(!saved||typeof saved!=='object')return structuredClone(base);
  const out=Array.isArray(base)?structuredClone(base):{...base};
  Object.keys(saved).forEach(k=>{
    if(saved[k]&&typeof saved[k]==='object'&&!Array.isArray(saved[k])&&base&&typeof base[k]==='object'&&!Array.isArray(base[k])) out[k]=deepMerge(base[k],saved[k]);
    else out[k]=saved[k];
  });
  return out;
}
function load(){try{return deepMerge(PLAN_DATA,JSON.parse(localStorage.getItem(STORE)))}catch(e){return structuredClone(PLAN_DATA)}}
function hydrate(s){const d=structuredClone(PLAN_DATA);s.settings={...d.settings,...(s.settings||{})};s.timeline=Array.isArray(s.timeline)?s.timeline:d.timeline;if(!Array.isArray(s.goals))s.goals=d.goals;s.goals.forEach((g,i)=>{if(!g.time)g.time=d.goals[i]?.time||''});['teachers','formations','committees'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=d[k];s[k].forEach((r,i)=>{if(!r.duration)r.duration=d[k]?.[i]?.duration||''})});if(!Array.isArray(s.followup))s.followup=d.followup;return s}

function today(){return new Date().toLocaleDateString('ar-SA-u-ca-islamic')+' | '+new Date().toLocaleDateString('ar-SA')}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function inlineSchoolEdit(el){state.settings.school=el.textContent.trim()||'اسم المدرسة';localStorage.setItem(STORE,JSON.stringify(state));}
function inlineYearEdit(el){state.settings.year=el.textContent.trim()||'1447هـ / 2026م';localStorage.setItem(STORE,JSON.stringify(state));}
function updateHeader(){const sh=document.getElementById('schoolHeader');if(document.activeElement!==sh)sh.textContent=state.settings.school;const dl=document.getElementById('dateLine');if(!dl.contains(document.activeElement)){const year=escapeHtml(state.settings.year);dl.innerHTML=today()+' — <span class="inline-edit" contenteditable="true" spellcheck="false" title="عدّل السنة/التاريخ مباشرة" oninput="inlineYearEdit(this)">'+year+'</span>';}const lp=document.getElementById('logoPreview');lp.innerHTML=state.settings.logo?'<img src="'+state.settings.logo+'">':'ن';}
function toast(msg){const box=document.getElementById('toastbox');const t=document.createElement('div');t.className='toast';t.textContent=msg;box.appendChild(t);setTimeout(()=>t.remove(),2800)}
function pct(){let items=[];state.goals.forEach(g=>items.push(...g.done));[...state.teachers,...state.formations,...state.committees].forEach(x=>items.push(x.status==='منجز'));return items.length?Math.round(items.filter(Boolean).length/items.length*100):0}
function counts(){let all=[...state.teachers,...state.formations,...state.committees];let done=all.filter(x=>x.status==='منجز').length+state.goals.reduce((a,g)=>a+g.done.filter(Boolean).length,0);let total=all.length+state.goals.reduce((a,g)=>a+g.done.length,0);return{done,total,overall:pct()}}

function statCard(label,num,suffix=''){return `<div class="card stat"><div class="label">${label}</div><div class="num" data-count="${num}">0${suffix}</div></div>`}
function renderDashboard(){const c=counts();document.getElementById('dashboard').innerHTML=`<div class="hero"><h2>لوحة قيادة خطة نافس</h2><p>متابعة تنفيذ الإجراءات، قياس التقدم، وتحويل الخطة من ورق نايم إلى منصة تصحصح الفريق.</p></div><div class="grid stats">${statCard('نسبة تنفيذ الخطة العامة',c.overall,'%')}${statCard('الإجراءات المنفذة',c.done)}${statCard('إجمالي الإجراءات',c.total)}${statCard('الطلاب المستهدفون',state.settings.students)}</div><div class="card" style="margin-top:16px"><div class="chart-title"><h3>التقدم العام</h3><b>${c.overall}%</b></div><div class="progress"><span style="width:${c.overall}%"></span></div></div><div class="grid two" style="margin-top:16px"><div class="card chart-wrap"><div class="chart-title"><h3>توزيع التنفيذ</h3></div><canvas class="chart" id="donut"></canvas></div><div class="card chart-wrap"><div class="chart-title"><h3>تطور التنفيذ الشهري</h3></div><canvas class="chart" id="line"></canvas></div></div><div class="card chart-wrap" style="margin-top:16px"><div class="chart-title"><h3>مقارنة الأداء بين المواد المستهدفة</h3><button class="btn" onclick="randomizeSubjects()">تحديث افتراضي</button></div><canvas class="chart" id="bar"></canvas></div>`;animateNums();setTimeout(drawCharts,50)}
function animateNums(){document.querySelectorAll('[data-count]').forEach(el=>{let target=parseInt(el.dataset.count),cur=0,step=Math.max(1,Math.ceil(target/28));let suffix=el.textContent.includes('%')?'%':'';let timer=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(timer)}el.textContent=cur+suffix},18)})}
function drawCharts(){drawDonut('donut');drawLine('line');drawBar('bar')}
function canvas(id){const c=document.getElementById(id);if(!c)return null;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const ctx=c.getContext('2d');ctx.scale(2,2);return{c,ctx,w:r.width,h:r.height}}
function drawDonut(id){const o=canvas(id);if(!o)return;const {ctx,w,h}=o,c=counts(),cx=w/2,cy=h/2,r=Math.min(w,h)/3;ctx.clearRect(0,0,w,h);let vals=[c.done,c.total-c.done],cols=['#006C35','#C9A961'],start=-Math.PI/2;vals.forEach((v,i)=>{let a=(v/c.total)*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,start,start+a);ctx.lineWidth=34;ctx.strokeStyle=cols[i];ctx.stroke();start+=a});ctx.font='bold 28px Segoe UI';ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink');ctx.textAlign='center';ctx.fillText(c.overall+'%',cx,cy+8);ctx.font='13px Segoe UI';ctx.fillText('منجز',cx,cy+32)}
function drawLine(id){const o=canvas(id);if(!o)return;const {ctx,w,h}=o,p=pct(),vals=[10,18,25,35,48,Math.max(52,p-10),p];ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(0,108,53,.16)';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=25+i*(h-55)/4;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-18,y);ctx.stroke()}ctx.beginPath();vals.forEach((v,i)=>{let x=35+i*(w-65)/(vals.length-1),y=h-28-(v/100)*(h-62);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#006C35';ctx.lineWidth=4;ctx.stroke();vals.forEach((v,i)=>{let x=35+i*(w-65)/(vals.length-1),y=h-28-(v/100)*(h-62);ctx.fillStyle='#C9A961';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()})}
function drawBar(id){const o=canvas(id);if(!o)return;const {ctx,w,h}=o,vals=state.subjects||[68,61,57],labs=['رياضيات','علوم','قراءة'];ctx.clearRect(0,0,w,h);vals.forEach((v,i)=>{let bw=(w-80)/3-25,x=40+i*((w-80)/3+10),bh=(v/100)*(h-70),y=h-35-bh;ctx.fillStyle=['#006C35','#C9A961','#0b8f54'][i];roundRect(ctx,x,y,bw,bh,12);ctx.fill();ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink');ctx.font='13px Segoe UI';ctx.textAlign='center';ctx.fillText(labs[i],x+bw/2,h-12);ctx.font='bold 16px Segoe UI';ctx.fillText(v+'%',x+bw/2,y-8)})}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function randomizeSubjects(){state.subjects=[55+Math.floor(Math.random()*35),55+Math.floor(Math.random()*35),55+Math.floor(Math.random()*35)];save();toast('تم تحديث قيم المقارنة الافتراضية')}
function renderGoals(){document.getElementById('goals').innerHTML=`<div class="hero"><h2>الخطة الإجرائية المكثفة</h2><p>ثلاثة أهداف تنفيذية مع متابعة إجراءات التنفيذ والشواهد والملاحظات.</p></div><div class="accordion">${state.goals.map((g,gi)=>{let pp=Math.round(g.done.filter(Boolean).length/g.done.length*100);return `<div class="acc-item open"><button class="acc-head" onclick="this.parentElement.classList.toggle('open')"><b>${g.title}</b><span>${pp}%</span></button><div class="acc-body"><div class="meta"><span class="pill">⏱️ <input class="date-edit" type="text" value="${g.time||''}" title="تعديل وقت التنفيذ" onclick="event.stopPropagation()" oninput="state.goals[${gi}].time=this.value;saveSilent()"></span><span class="pill">👤 ${g.owner}</span><span class="pill">🤝 ${g.support}</span><span class="pill">📌 ${g.indicator}</span></div><h4>إجراءات التنفيذ</h4><div class="check-list">${g.actions.map((a,ai)=>`<label class="check-row"><input type="checkbox" ${g.done[ai]?'checked':''} onchange="state.goals[${gi}].done[${ai}]=this.checked;save();checkConfetti()"><span>${a}</span></label>`).join('')}</div><div class="progress"><span style="width:${pp}%"></span></div><p><b>وسيلة التنفيذ:</b> ${g.tools}</p><div class="form-grid"><div class="field"><label>ملاحظات التنفيذ</label><textarea oninput="state.goals[${gi}].notes=this.value;saveSilent()">${g.notes||''}</textarea></div><div class="field"><label>رفع صورة شاهد</label><input type="file" accept="image/*" onchange="readEvidence(event,${gi})">${g.evidence?`<img src="${g.evidence}" style="max-width:100%;margin-top:8px;border-radius:14px;border:1px solid var(--line)">`:''}</div></div></div></div>`}).join('')}</div>`}
function readEvidence(ev,gi){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.goals[gi].evidence=r.result;save();toast('تم حفظ الشاهد')};r.readAsDataURL(f)}
function tableRows(type){return state[type].map((r,i)=>`<tr><td>${i+1}</td><td>${r.text}</td><td>${r.owner}</td><td>${r.follow}</td><td><input class="table-date-edit" type="text" value="${r.duration||''}" oninput="state['${type}'][${i}].duration=this.value;saveSilent()"></td><td>${r.indicator}</td><td><select class="status" data-v="${r.status}" onchange="updateStatus('${type}',${i},this)"><option ${r.status==='لم يبدأ'?'selected':''}>لم يبدأ</option><option ${r.status==='جارٍ'?'selected':''}>جارٍ</option><option ${r.status==='منجز'?'selected':''}>منجز</option></select></td><td><textarea oninput="state['${type}'][${i}].notes=this.value;saveSilent()">${r.notes||''}</textarea><small>${r.updated?'آخر تحديث: '+r.updated:''}</small></td></tr>`).join('')}
function renderPlanTable(id,type,title,desc){document.getElementById(id).innerHTML=`<div class="hero"><h2>${title}</h2><p>${desc}</p></div><div class="toolbar no-print"><button class="btn primary" onclick="markAll('${type}')">اعتماد الكل منجز</button></div><div class="card table-wrap"><table><thead><tr><th>م</th><th>إجراء التنفيذ</th><th>مسؤولية التنفيذ</th><th>المتابعة</th><th>مدة التنفيذ</th><th>مؤشر الإنجاز</th><th>الحالة</th><th>ملاحظات</th></tr></thead><tbody>${tableRows(type)}</tbody></table></div>`}
function updateStatus(type,i,el){state[type][i].status=el.value;state[type][i].updated=new Date().toLocaleString('ar-SA');save();checkConfetti()}
function markAll(type){state[type].forEach(x=>{x.status='منجز';x.updated=new Date().toLocaleString('ar-SA')});save();toast('تم اعتماد جميع الإجراءات كمنجزة');checkConfetti()}
function renderFollowup(){
  window.followQuery = window.followQuery || '';
  window.followFilter = window.followFilter || 'all';
  let q=window.followQuery.toLowerCase(), f=window.followFilter;
  let rows=state.followup.filter(r=>(f==='all'||r.status===f)&&Object.values(r).join(' ').toLowerCase().includes(q));
  document.getElementById('followup').innerHTML=`<div class="hero"><h2>نظام المتابعة وسجل التنفيذ</h2><p>سجل ديناميكي للإجراءات، أسباب عدم التنفيذ، تاريخ التنفيذ المقترح، ومؤشر التحقق.</p></div><div class="toolbar no-print"><button type="button" class="btn primary" onclick="addFollow(event)">إضافة سجل جديد</button><input type="text" placeholder="بحث فوري..." value="${window.followQuery}" oninput="window.followQuery=this.value;renderFollowup()" style="max-width:240px"><select onchange="window.followFilter=this.value;renderFollowup()" style="max-width:180px"><option value="all" ${f==='all'?'selected':''}>كل الحالات</option><option ${f==='نُفذ'?'selected':''}>نُفذ</option><option ${f==='لم يُنفذ'?'selected':''}>لم يُنفذ</option></select><button class="btn" onclick="printPlan()">PDF / طباعة</button></div><div class="card table-wrap"><table><thead><tr><th>م</th><th>إجراء التنفيذ</th><th>تاريخ التنفيذ المدوّن</th><th>حالة المتابعة</th><th>أسباب عدم التنفيذ</th><th>تاريخ التنفيذ المقترح</th><th>مؤشر التحقق</th><th class="no-print">إجراءات</th></tr></thead><tbody>${rows.map((r,i)=>`<tr data-follow-id="${r.id}"><td>${i+1}</td><td><textarea oninput="rFollow(${r.id},'action',this.value)">${r.action}</textarea></td><td><input class="table-date-edit" type="text" placeholder="مثال: 5/7/1447هـ" value="${r.date}" oninput="rFollow(${r.id},'date',this.value)"></td><td><select onchange="rFollow(${r.id},'status',this.value)"><option ${r.status==='نُفذ'?'selected':''}>نُفذ</option><option ${r.status==='لم يُنفذ'?'selected':''}>لم يُنفذ</option></select></td><td><textarea oninput="rFollow(${r.id},'reason',this.value)">${r.reason}</textarea></td><td><input class="table-date-edit" type="text" placeholder="مثال: 12/9/1447هـ" value="${r.proposed}" oninput="rFollow(${r.id},'proposed',this.value)"></td><td><textarea oninput="rFollow(${r.id},'verify',this.value)">${r.verify}</textarea></td><td class="no-print"><button type="button" class="btn danger" onclick="delFollow(${r.id})">حذف</button></td></tr>`).join('')}</tbody></table></div>`;
}
function addFollow(ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  if(!Array.isArray(state.followup)) state.followup=[];
  const item={
    id:Date.now()+Math.floor(Math.random()*100000),
    action:'إجراء جديد',
    date:'',
    status:'لم يُنفذ',
    reason:'',
    proposed:'',
    verify:'شاهد تحقق'
  };
  state.followup.unshift(item);
  window.followFilter='all';
  window.followQuery='';
  saveSilent();

  // إعادة بناء صفحة المتابعة فوراً بدون انتظار الانتقال بين الأيقونات
  renderAll(false);
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  const sec=document.getElementById('followup');
  if(sec) sec.classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent.includes('نظام المتابعة')));

  setTimeout(()=>{
    const row=document.querySelector(`#followup tbody tr[data-follow-id="${item.id}"]`) || document.querySelector('#followup tbody tr');
    if(row){row.scrollIntoView({behavior:'smooth',block:'center'});}
    const first=row?row.querySelector('textarea'):document.querySelector('#followup tbody tr textarea');
    if(first){first.focus();first.select();}
  },60);
  toast('تمت إضافة سجل جديد');
}
function rFollow(id,k,v){let r=state.followup.find(x=>x.id===id);if(r){r[k]=v;saveSilent()}}
function delFollow(id){state.followup=state.followup.filter(x=>x.id!==id);save();toast('تم حذف السجل')}
function renderReports(){let c=counts(),rec=smartRecs();document.getElementById('reports').innerHTML=`<div class="hero"><h2>التقارير والتحليلات الذكية</h2><p>توصيات فورية مبنية على حالة التنفيذ، مع تقرير قابل للطباعة والتصدير PDF من المتصفح.</p></div><div class="grid two"><div class="card"><h3>ملخص الأداء</h3><p>نسبة التنفيذ العامة: <b>${c.overall}%</b></p><p>الإجراءات المنفذة: <b>${c.done}</b> من <b>${c.total}</b></p><div class="progress"><span style="width:${c.overall}%"></span></div><div class="toolbar no-print" style="margin-top:14px"><button class="btn primary" onclick="renderReports();toast('تم توليد التحليل')">تحليل ذكي</button><button class="btn gold" onclick="printPlan()">حفظ PDF / طباعة</button></div></div><div class="card"><h3>التوصيات الذكية</h3>${rec.map(x=>`<p class="pill">${x}</p>`).join('')}</div></div><div class="card" style="margin-top:16px"><h3>المخطط الزمني للخطة</h3><div class="timeline">${state.timeline.map((t,i)=>`<div class="tl"><input class="date-edit" type="text" value="${t.date||''}" title="تعديل التاريخ" oninput="state.timeline[${i}].date=this.value;saveSilent()"><br><textarea oninput="state.timeline[${i}].text=this.value;saveSilent()" style="min-height:38px">${t.text||''}</textarea></div>`).join('')}</div></div><div class="card print-only"><h2 class="print-title">تقرير خطة تحسين نواتج تعلم اختبارات نافس</h2><p>المدرسة: ${state.settings.school} — الإدارة: ${state.settings.edu} — السنة: ${state.settings.year}</p><div class="signature"><div class="sign">مدير/ة المدرسة<br>${state.settings.principal}</div><div class="sign">المشرف/ة التربوي/ة<br>${state.settings.supervisor}</div></div></div>`}
function smartRecs(){let all=[...state.teachers,...state.formations,...state.committees],teacherDone=state.teachers.filter(x=>x.status==='منجز').length/state.teachers.length*100,reading=state.teachers[6].status==='منجز',overall=pct(),r=[];if(teacherDone<50)r.push('تنفيذ المعلمين أقل من 50%؛ يوصى بعقد اجتماع مهني عاجل وتحديد التزامات أسبوعية واضحة.');if(!reading)r.push('لم يكتمل إجراء الفهم القرائي؛ يلزم تثبيت حصص القراءة وربطها بمهارات نافس.');if(overall>=80)r.push('الأداء تجاوز 80%؛ وقت التكريم والتحفيز، لا ننتظر حتى يبرد الشاي.');if(overall<40)r.push('الخطة تحتاج دفعاً تنفيذياً: قلل الإجراءات الورقية وزد المتابعة الصفية والشواهد المباشرة.');r.push('استمر في قياس أثر الاختبارات القبلية والبعدية ومقارنة التحسن مع خط الأساس 2024م.');return r}
function exportRows(name,rows){let html='<table border="1" dir="rtl">'+rows+'</table>';let blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.xls';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير ملف Excel')}
function exportTable(type){let rows='<tr><th>م</th><th>الإجراء</th><th>المسؤول</th><th>المتابعة</th><th>المدة</th><th>المؤشر</th><th>الحالة</th><th>ملاحظات</th></tr>'+state[type].map((r,i)=>`<tr><td>${i+1}</td><td>${r.text}</td><td>${r.owner}</td><td>${r.follow}</td><td><input class="table-date-edit" type="text" value="${r.duration||''}" oninput="state['${type}'][${i}].duration=this.value;saveSilent()"></td><td>${r.indicator}</td><td>${r.status}</td><td>${r.notes||''}</td></tr>`).join('');exportRows('nafis_'+type,rows)}
function exportFollow(){let rows='<tr><th>م</th><th>إجراء التنفيذ</th><th>تاريخ التنفيذ</th><th>حالة المتابعة</th><th>أسباب عدم التنفيذ</th><th>تاريخ مقترح</th><th>مؤشر التحقق</th></tr>'+state.followup.map((r,i)=>`<tr><td>${i+1}</td><td>${r.action}</td><td>${r.date}</td><td>${r.status}</td><td>${r.reason}</td><td>${r.proposed}</td><td>${r.verify}</td></tr>`).join('');exportRows('nafis_followup',rows)}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nafis_backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير النسخة الاحتياطية')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();toast('تم استيراد النسخة بنجاح')}catch(err){toast('ملف JSON غير صالح')}};r.readAsText(f)}
function byId(id){return document.getElementById(id)}
function openSettings(){
  const s=state.settings||PLAN_DATA.settings;
  byId('setSchool').value=s.school||'';
  byId('setEdu').value=s.edu||'';
  byId('setPrincipal').value=s.principal||'';
  byId('setSupervisor').value=s.supervisor||'';
  byId('setYear').value=s.year||'';
  byId('setStudents').value=s.students||0;
  byId('setBase').value=s.baseline||0;
  byId('setLogo').value='';
  byId('settingsModal').classList.add('open');
}
function closeSettings(){byId('settingsModal').classList.remove('open')}
function saveSettings(){
  state.settings={...(state.settings||{})};
  state.settings.school=byId('setSchool').value.trim()||'اسم المدرسة';
  state.settings.edu=byId('setEdu').value.trim()||'الإدارة التعليمية';
  state.settings.principal=byId('setPrincipal').value.trim()||'اسم مدير/ة المدرسة';
  state.settings.supervisor=byId('setSupervisor').value.trim()||'اسم المشرف/ة التربوي/ة';
  state.settings.year=byId('setYear').value.trim()||'1447هـ / 2026م';
  state.settings.students=Number(byId('setStudents').value)||0;
  state.settings.baseline=Number(byId('setBase').value)||0;
  const f=byId('setLogo').files[0];
  const finish=()=>{
    localStorage.setItem(STORE,JSON.stringify(state));
    updateHeader();
    renderAll(false);
    closeSettings();
    toast('تم حفظ إعدادات المنصة');
  };
  if(f){const r=new FileReader();r.onload=()=>{state.settings.logo=r.result;finish()};r.readAsDataURL(f)}
  else{finish()}
}
function resetAll(){if(confirm('سيتم تفريغ البيانات الحالية وإرجاع القيم الابتدائية. هل أنت متأكد؟')){localStorage.removeItem(STORE);state=structuredClone(PLAN_DATA);save();toast('تمت إعادة الضبط')}}
function toggleTheme(){let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('nafis_theme',t);drawCharts();toast('تم تبديل الوضع')}
function printPlan(){renderAll(false);show('reports');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent.includes('التقارير')));setTimeout(()=>window.print(),250)}
function checkConfetti(){if(pct()>=100)confetti()}
function confetti(){for(let i=0;i<90;i++){let d=document.createElement('i');d.style.cssText=`position:fixed;z-index:3000;top:-10px;right:${Math.random()*100}vw;width:8px;height:12px;background:${['#006C35','#C9A961','#0b8f54','#fff'][i%4]};transform:rotate(${Math.random()*360}deg);animation:fall ${1.8+Math.random()*1.8}s linear forwards`;document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}if(!document.getElementById('fallstyle')){let s=document.createElement('style');s.id='fallstyle';s.textContent='@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.1}}';document.head.appendChild(s)}toast('ممتاز! اكتملت الخطة 100%')}
function renderAll(full=true){renderDashboard();renderGoals();renderPlanTable('teachers','teachers','خطة معلمي المواد المستهدفة','ثمانية إجراءات تنفيذية للرياضيات والعلوم والقراءة مع حالة تنفيذ وملاحظات.');renderPlanTable('formations','formations','خطة التشكيلات المدرسية','عشرة إجراءات لإدارة المدرسة والوكلاء والتوجيه الطلابي بتوزيع مسؤوليات واضح.');renderPlanTable('committees','committees','خطة اللجان المدرسية','سبعة إجراءات للجان التحصيل والتوجيه والتميز واللجنة الإدارية.');renderFollowup();renderReports();}
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();saveSilent();toast('تم الحفظ')}if(e.ctrlKey&&e.key.toLowerCase()==='p'){e.preventDefault();printPlan()}if(e.ctrlKey&&e.key.toLowerCase()==='d'){e.preventDefault();toggleTheme()}});
window.addEventListener('load',()=>{document.documentElement.dataset.theme=localStorage.getItem('nafis_theme')||'light';renderNav();updateHeader();renderAll();setTimeout(()=>splash.classList.add('hide'),1500)});
</script>
</body>
</html>
